# SonarQube Cloud configuration, read by the scan step in .github/workflows/ci.yml
# Check both keys in SonarQube Cloud: Project > Information
sonar.organization=upskillingmyself2026
sonar.projectKey=S-1408_frontend
sonar.projectName=frontend
sonar.projectVersion=1.0

# Production code vs tests, so tests don't count as "code to cover"
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# Test helpers and the app entry point aren't worth covering
sonar.coverage.exclusions=src/main.tsx,src/**/*.d.ts

# Produced by `npm run test:coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8